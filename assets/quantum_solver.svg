<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="380" style="background:#0d1117; border: 1px solid #30363d; border-radius: 10px;">
  <defs>
    <style>
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; fill: #58a6ff; font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; fill: #8b949e; font-size: 12px; }
      .text-eq { font-family: 'Times New Roman', serif; font-style: italic; font-size: 13px; }
      .grid { stroke: #21262d; stroke-width: 1; stroke-dasharray: 4 4; }
      .potential { stroke: #ff7b72; stroke-width: 2.5; fill: none; }
      .energy-line { stroke: #484f58; stroke-width: 1.5; stroke-dasharray: 5 4; }
      
      /* Animaciones de fase cuántica: e^(-i E_n t / hbar) */
      .psi0 {
        stroke: #58a6ff; stroke-width: 2.5; fill: none;
        animation: pulse0 3.2s ease-in-out infinite alternate;
        transform-origin: 380px 280px;
      }
      .psi1 {
        stroke: #3fb950; stroke-width: 2.5; fill: none;
        animation: pulse1 2.2s ease-in-out infinite alternate;
        transform-origin: 380px 200px;
      }
      .psi2 {
        stroke: #d2a8ff; stroke-width: 2.5; fill: none;
        animation: pulse2 1.5s ease-in-out infinite alternate;
        transform-origin: 380px 120px;
      }

      @keyframes pulse0 {
        0% { transform: scaleY(1); opacity: 0.85; }
        100% { transform: scaleY(1.22); opacity: 1; }
      }
      @keyframes pulse1 {
        0% { transform: scaleY(0.85) scaleX(0.98); opacity: 0.8; }
        100% { transform: scaleY(1.25) scaleX(1.02); opacity: 1; }
      }
      @keyframes pulse2 {
        0% { transform: scaleY(1.2); opacity: 1; }
        100% { transform: scaleY(0.8); opacity: 0.75; }
      }
    </style>
  </defs>

  <!-- Rejilla de fondo -->
  <line x1="80" y1="60" x2="680" y2="60" class="grid" />
  <line x1="80" y1="120" x2="680" y2="120" class="grid" />
  <line x1="80" y1="200" x2="680" y2="200" class="grid" />
  <line x1="80" y1="280" x2="680" y2="280" class="grid" />
  <line x1="380" y1="50" x2="380" y2="330" class="grid" />

  <!-- Título técnico integrado -->
  <text x="35" y="38" class="text-title">EIGENSTATES IN HARMONIC POTENTIAL</text>
  <text x="495" y="38" class="text-sub">FDM Solver: Hψ = Eψ (eigh)</text>

  <!-- Potencial Parabólico V(x) = 1/2 m w^2 x^2 -->
  <path d="M 140,55 Q 380,395 620,55" class="potential" />
  <text x="630" y="70" fill="#ff7b72" class="text-eq">V(x)</text>

  <!-- Nivel E2 (n=2) -->
  <line x1="175" y1="120" x2="585" y2="120" class="energy-line" />
  <text x="600" y="124" fill="#d2a8ff" class="text-eq">E₂ = ⁵⁄₂ ℏω</text>
  <text x="125" y="124" fill="#d2a8ff" class="text-eq">ψ₂(x)</text>
  <!-- Curva ψ2 (simétrica, 2 nodos) centrada en y=120 -->
  <path d="M 190,120 Q 240,150 285,120 T 380,85 T 475,120 Q 520,150 570,120" class="psi2" />

  <!-- Nivel E1 (n=1) -->
  <line x1="220" y1="200" x2="540" y2="200" class="energy-line" />
  <text x="555" y="204" fill="#3fb950" class="text-eq">E₁ = ³⁄₂ ℏω</text>
  <text x="170" y="204" fill="#3fb950" class="text-eq">ψ₁(x)</text>
  <!-- Curva ψ1 (antisimétrica, 1 nodo) centrada en y=200 -->
  <path d="M 230,200 C 270,240 330,240 380,200 C 430,160 490,160 530,200" class="psi1" />

  <!-- Nivel E0 (n=0 Estado Fundamental) -->
  <line x1="265" y1="280" x2="495" y2="280" class="energy-line" />
  <text x="510" y="284" fill="#58a6ff" class="text-eq">E₀ = ½ ℏω</text>
  <text x="215" y="284" fill="#58a6ff" class="text-eq">ψ₀(x)</text>
  <!-- Curva ψ0 (Gaussiana) centrada en y=280 -->
  <path d="M 270,280 Q 380,230 490,280" class="psi0" />

  <!-- Eje X -->
  <line x1="100" y1="335" x2="660" y2="335" stroke="#8b949e" stroke-width="1.5" />
  <text x="670" y="339" fill="#8b949e" class="text-eq">x</text>
  <text x="375" y="355" fill="#8b949e" class="text-sub">x = 0</text>
</svg>
